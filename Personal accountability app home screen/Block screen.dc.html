<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-f7d4f4b9-5efb-4327-8360-eae7fa398138/styles.css">
<script src="_ds/nocturne-f7d4f4b9-5efb-4327-8360-eae7fa398138/_ds_bundle.js"></script>
<style>@keyframes noct-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style>
</helmet>
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ true }}" hint-size="390px,844px">
<div style="position:relative;height:100%;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);overflow:hidden">
<div style="flex:1;overflow-y:auto;padding:66px 20px 34px;display:flex;flex-direction:column;gap:var(--space-8)">

<header>
<div style="display:flex;align-items:center;gap:8px">
<span style="width:6px;height:6px;border-radius:50%;background:var(--color-accent)"></span>
<span style="font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent)">block running</span>
</div>
<div style="font-size:12.5px;color:color-mix(in srgb, var(--color-text) 45%, transparent);margin-top:8px">{{ project }}</div>
</header>

<section>
<div style="font-family:var(--font-heading);font-weight:500;font-size:26px;line-height:1.2;letter-spacing:-0.02em;text-wrap:pretty">{{ task }}</div>
<div style="font-size:14px;color:color-mix(in srgb, var(--color-text) 55%, transparent);margin-top:10px">{{ elapsed }} · ends at {{ endsAt }}</div>
</section>

<sc-if value="{{ isRunning }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:var(--space-3)">
<button class="btn btn-secondary" style="min-height:48px;font-size:15px;width:100%" onClick="{{ onDone }}">Mark done</button>
<button class="btn btn-secondary" style="min-height:48px;font-size:15px;width:100%" onClick="{{ onMove }}">Move it</button>
<button class="btn btn-secondary" style="min-height:48px;font-size:15px;width:100%" onClick="{{ onHelp }}">I don't know how to start</button>
</div>
</sc-if>

<sc-if value="{{ isHelp }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:var(--space-8)">
<sc-for list="{{ chat }}" as="m" hint-placeholder-count="2">
<div>
<sc-if value="{{ m.isUser }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;justify-content:flex-end">
<div style="max-width:78%;background:var(--color-surface);border-radius:var(--radius-lg);padding:10px 14px;font-size:15px;line-height:1.45;text-wrap:pretty">{{ m.text }}</div>
</div>
</sc-if>
<sc-if value="{{ m.isPast }}" hint-placeholder-val="{{ false }}">
<div style="max-width:88%;font-size:15px;line-height:1.5;color:color-mix(in srgb, var(--color-text) 55%, transparent);text-wrap:pretty">{{ m.text }}</div>
</sc-if>
<sc-if value="{{ m.isAsk }}" hint-placeholder-val="{{ true }}">
<div style="max-width:92%;font-family:var(--font-heading);font-weight:500;font-size:19px;line-height:1.35;letter-spacing:-0.015em;text-wrap:pretty;animation:noct-in 260ms ease both">{{ m.text }}</div>
</sc-if>
</div>
</sc-for>

<div style="display:flex;flex-wrap:wrap;gap:var(--space-3)">
<sc-for list="{{ replies }}" as="r" hint-placeholder-count="2">
<button class="btn btn-primary" style="min-height:44px;border-radius:22px;font-size:14px;padding-inline:var(--space-6)" onClick="{{ r.pick }}">{{ r.label }}</button>
</sc-for>
</div>

<sc-if value="{{ proposal }}" hint-placeholder-val="{{ false }}">
<div style="border:1px solid color-mix(in srgb, var(--color-accent) 40%, transparent);border-radius:var(--radius-lg);padding:var(--space-6);animation:noct-in 260ms ease both">
<div style="font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent);margin-bottom:8px">start with this</div>
<div style="font-family:var(--font-heading);font-weight:500;font-size:19px;line-height:1.3;text-wrap:pretty">{{ proposal }}</div>
<div style="font-size:12.5px;color:color-mix(in srgb, var(--color-text) 50%, transparent);margin-top:8px">{{ proposalNote }}</div>
<button class="btn btn-secondary" style="min-height:46px;font-size:15px;width:100%;margin-top:var(--space-6)" onClick="{{ onAcceptPlan }}">Okay, starting that</button>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ isSettled }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:var(--space-6);animation:noct-in 260ms ease both">
<div style="font-size:15px;line-height:1.5;color:color-mix(in srgb, var(--color-text) 55%, transparent);text-wrap:pretty">{{ closingLine }}</div>
<div style="display:flex;flex-direction:column;gap:var(--space-3)">
<button class="btn btn-secondary" style="min-height:48px;font-size:15px;width:100%" onClick="{{ onDone }}">Mark done</button>
<button class="btn btn-secondary" style="min-height:48px;font-size:15px;width:100%" onClick="{{ onMove }}">Move it</button>
</div>
</div>
</sc-if>

<sc-if value="{{ closed }}" hint-placeholder-val="{{ false }}">
<div style="border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:var(--space-6);animation:noct-in 260ms ease both">
<div style="font-family:var(--font-heading);font-weight:500;font-size:17px">{{ closedTitle }}</div>
<div style="font-size:13px;color:color-mix(in srgb, var(--color-text) 55%, transparent);margin-top:6px;text-wrap:pretty">{{ closedNote }}</div>
</div>
</sc-if>

<div style="margin-top:auto;padding-top:var(--space-6);font-size:12px;color:color-mix(in srgb, var(--color-text) 35%, transparent);background:linear-gradient(to right, transparent, var(--color-divider) 24px, var(--color-divider) calc(100% - 24px), transparent) no-repeat top / 100% 1px">{{ footNote }}</div>

</div>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;460&quot;,&quot;height&quot;:&quot;920&quot;},&quot;start&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;running&quot;,&quot;help&quot;],&quot;default&quot;:&quot;running&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = {
      mode: p.start === "help" ? "help" : "running",
      step: 0,
      log: [],
      task: "Rewrite the résumé summary",
      closed: null
    };
  }
  script = [
    {
      ask: "No problem. What is in front of you right now?",
      replies: [
        { label: "A blank page", said: "A blank page" },
        { label: "A draft I don't like", said: "A draft I don't like" }
      ]
    },
    {
      ask: "Then the summary is the wrong place to start — it is the last thing you write, not the first. About seventy minutes left. Want the smaller version?",
      replies: [
        { label: "Yes, smaller", said: "Yes, smaller" },
        { label: "What is it first", said: "What is it first" }
      ]
    }
  ];
  proposalText = "List three things you actually did in your last role. Plain sentences, nothing polished.";
  renderVals() {
    const s = this.state;
    const node = s.mode === "help" && s.step < this.script.length ? this.script[s.step] : null;
    const showProposal = s.mode === "help" && s.step >= this.script.length;
    const log = s.log.concat(node ? [{ who: "bot", text: node.ask, ask: true }] : []);
    return {
      project: "New job — 5 first rounds",
      task: s.task,
      elapsed: s.mode === "settled" ? "about twenty-five minutes in" : "about twenty minutes in",
      endsAt: "8:30 pm",
      isRunning: s.mode === "running",
      isHelp: s.mode === "help",
      isSettled: s.mode === "settled",
      chat: log.map((m) => ({
        text: m.text,
        isUser: m.who === "user",
        isPast: m.who === "bot" && !m.ask,
        isAsk: !!m.ask
      })),
      replies: node ? node.replies.map((r) => ({
        label: r.label,
        pick: () => this.setState({
          step: s.step + 1,
          log: s.log.concat([{ who: "bot", text: node.ask }, { who: "user", text: r.said }])
        })
      })) : [],
      proposal: showProposal ? this.proposalText : null,
      proposalNote: "fifteen minutes of work, and the summary writes itself off the back of it.",
      onAcceptPlan: () => this.setState({ mode: "settled", task: "List three things you did in the last role" }),
      closingLine: "That is the block now. I will check in at 8:30 — nothing else to decide.",
      onDone: () => this.setState({ mode: "closed", closed: "done" }),
      onMove: () => this.setState({ mode: "closed", closed: "moved" }),
      closed: s.mode === "closed",
      closedTitle: s.closed === "done" ? "Kept. that is the block." : "Moved to tomorrow, 7:00 pm.",
      closedNote: s.closed === "done" ? "next block is saturday at 9:30 am." : "your calendar is updated. nothing else changes.",
      footNote: s.mode === "help" ? "this conversation ends with one thing to do." : "nothing else is due today."
    };
  }
}
</script>
</body>
</html>
