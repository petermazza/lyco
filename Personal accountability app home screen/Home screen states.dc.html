<helmet>
<link rel="stylesheet" href="_ds/nocturne-f7d4f4b9-5efb-4327-8360-eae7fa398138/styles.css">

<div style="min-height:100vh;background:#0f111c;padding:36px 24px 60px;display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start;justify-content:center;font-family:var(--font-body);color:var(--app-text)">

<div style="font-size:var(--app-size-meta);color:var(--app-text-muted)">Loading — each section arrives on its own</div>
<dc-import name="Home states phone" mode="loading" hint-size="420px,900px"></dc-import>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:var(--app-size-meta);color:var(--app-text-muted)">Empty — first login, nothing set up</div>
<dc-import name="Home states phone" mode="empty" hint-size="420px,900px"></dc-import>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:var(--app-size-meta);color:var(--app-text-muted)">Partly filled — calendar connected, no spending targets</div>
<dc-import name="Home states phone" mode="partial" hint-size="420px,900px"></dc-import>
</div>

</div>
